name: AGY iPhone IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agy-iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Generate Xcode project
        run: python3 scripts/generate-project.py
      - name: Archive and package iPhone IPA
        run: bash scripts/package.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: AGY-iPhone-resign
          path: |
            dist/AGY-iPhone-resign.ipa
            dist/build-manifest.json
            dist/official-icon.png
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AGY-build-log
          path: dist/build.log
